<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configuración Pebble Watchface</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --text-main: #ffffff;
      --text-muted: #9e9e9e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --btn-secondary: #333333;
      --input-bg: #2a2a2a;
      --input-border: #404040;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="url"]:focus {
      border-color: var(--accent);
    }

    .url-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
    }

    .emoji-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .emoji-btn {
      background: #252525;
      border: 1px solid #383838;
      border-radius: 6px;
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s, background 0.2s;
    }

    .emoji-btn:active {
      transform: scale(0.92);
      background: var(--accent);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      margin-bottom: 30px;
    }

    button.btn-primary {
      flex: 2;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }

    button.btn-primary:active {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      flex: 1;
      background: var(--btn-secondary);
      color: var(--text-muted);
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .badge {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Ajustes Pebble Watchface</h1>
    <p>Configuración de Gluroo y URLs personalizadas</p>
  </header>

  <!-- SECCIÓN GLUROO -->
  <div class="card">
    <div class="card-title">
      <span>🩸</span> Gluroo (Glucosa)
    </div>
    <div class="form-group">
      <label for="gluroo_token">Gluroo Token</label>
      <input type="text" id="gluroo_token" placeholder="Ej: e8bae8c4-0c1e-4b5b-9387-...">
    </div>
  </div>

  <!-- SECCIÓN URLS -->
  <div class="card">
    <div class="card-title">
      <span>🌐</span> URLs para Display Inferior <span class="badge">Hasta 4</span>
    </div>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">
      El display inferior rotará entre los valores devueltos por estas URLs al pulsar el botón <strong>DOWN</strong>.
    </p>

    <!-- URL 1 -->
    <div style="border-bottom: 1px solid #292929; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="form-group">
        <label>URL 1</label>
        <input type="url" id="url_1" placeholder="https://api.tu-servidor.com/sensor1">
      </div>
      <div class="form-group url-row">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_1" placeholder="🏠" maxlength="4">
        </div>
        <div>
          <label>Etiqueta / Texto</label>
          <input type="text" id="label_1" placeholder="CASA" maxlength="6">
        </div>
      </div>
      <div class="emoji-presets" data-target="icon_1">
        <button type="button" class="emoji-btn">🏠</button>
        <button type="button" class="emoji-btn">🌡</button>
        <button type="button" class="emoji-btn">⚡</button>
        <button type="button" class="emoji-btn">💡</button>
        <button type="button" class="emoji-btn">🚗</button>
        <button type="button" class="emoji-btn">💧</button>
      </div>
    </div>

    <!-- URL 2 -->
    <div style="border-bottom: 1px solid #292929; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="form-group">
        <label>URL 2</label>
        <input type="url" id="url_2" placeholder="https://api.tu-servidor.com/sensor2">
      </div>
      <div class="form-group url-row">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_2" placeholder="⚡" maxlength="4">
        </div>
        <div>
          <label>Etiqueta / Texto</label>
          <input type="text" id="label_2" placeholder="KW" maxlength="6">
        </div>
      </div>
      <div class="emoji-presets" data-target="icon_2">
        <button type="button" class="emoji-btn">⚡</button>
        <button type="button" class="emoji-btn">🔋</button>
        <button type="button" class="emoji-btn">📈</button>
        <button type="button" class="emoji-btn">☀️</button>
        <button type="button" class="emoji-btn">🌬</button>
        <button type="button" class="emoji-btn">CO2</button>
      </div>
    </div>

    <!-- URL 3 -->
    <div style="border-bottom: 1px solid #292929; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="form-group">
        <label>URL 3</label>
        <input type="url" id="url_3" placeholder="https://api.tu-servidor.com/sensor3">
      </div>
      <div class="form-group url-row">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_3" placeholder="🌡" maxlength="4">
        </div>
        <div>
          <label>Etiqueta / Texto</label>
          <input type="text" id="label_3" placeholder="TEMP" maxlength="6">
        </div>
      </div>
      <div class="emoji-presets" data-target="icon_3">
        <button type="button" class="emoji-btn">🌡</button>
        <button type="button" class="emoji-btn">❄️</button>
        <button type="button" class="emoji-btn">🔥</button>
        <button type="button" class="emoji-btn">💨</button>
        <button type="button" class="emoji-btn">📊</button>
      </div>
    </div>

    <!-- URL 4 -->
    <div>
      <div class="form-group">
        <label>URL 4</label>
        <input type="url" id="url_4" placeholder="https://api.tu-servidor.com/sensor4">
      </div>
      <div class="form-group url-row">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_4" placeholder="📊" maxlength="4">
        </div>
        <div>
          <label>Etiqueta / Texto</label>
          <input type="text" id="label_4" placeholder="LUZ" maxlength="6">
        </div>
      </div>
      <div class="emoji-presets" data-target="icon_4">
        <button type="button" class="emoji-btn">💰</button>
        <button type="button" class="emoji-btn">💡</button>
        <button type="button" class="emoji-btn">🌐</button>
        <button type="button" class="emoji-btn">📈</button>
        <button type="button" class="emoji-btn">🔒</button>
      </div>
    </div>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="actions">
    <button type="button" class="btn-secondary" id="btn-cancel">Cancelar</button>
    <button type="button" class="btn-primary" id="btn-save">Guardar</button>
  </div>
</div>

<script>
  // Obtener parámetro de URL
  function getQueryParam(variable, defaultVal) {
    var query = window.location.search.substring(1);
    var vars = query.split('&');
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split('=');
      if (decodeURIComponent(pair[0]) === variable) {
        return decodeURIComponent(pair[1]);
      }
    }
    return defaultVal || null;
  }

  // Cargar configuración existente
  function loadSettings() {
    var settingsRaw = getQueryParam('settings');
    if (!settingsRaw) {
      settingsRaw = localStorage.getItem('pebble_settings');
    }

    if (settingsRaw) {
      try {
        var settings = JSON.parse(settingsRaw);

        if (settings.gluroo_token) {
          document.getElementById('gluroo_token').value = settings.gluroo_token;
        }

        if (settings.urls && Array.isArray(settings.urls)) {
          settings.urls.forEach(function(item, index) {
            var i = index + 1;
            if (i <= 4) {
              document.getElementById('url_' + i).value = item.url || '';
              document.getElementById('icon_' + i).value = item.icon || '';
              document.getElementById('label_' + i).value = item.label || '';
            }
          });
        }
      } catch (e) {
        console.error("Error parseando ajustes:", e);
      }
    }
  }

  // Asignar clics a los emojis de acceso rápido
  document.querySelectorAll('.emoji-presets').forEach(function(container) {
    var targetId = container.getAttribute('data-target');
    var input = document.getElementById(targetId);

    container.querySelectorAll('.emoji-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        input.value = this.innerText.trim();
      });
    });
  });

  // Guardar configuración y devolver a la app Pebble
  document.getElementById('btn-save').addEventListener('click', function() {
    var urlsList = [];

    for (var i = 1; i <= 4; i++) {
      var urlVal = document.getElementById('url_' + i).value.trim();
      var iconVal = document.getElementById('icon_' + i).value.trim();
      var labelVal = document.getElementById('label_' + i).value.trim();

      if (urlVal !== '') {
        // Si hay icono y etiqueta, combinamos para el display (ej: "🏠 CASA" o solo icono)
        var finalLabel = labelVal;
        if (iconVal !== '' && labelVal !== '') {
          finalLabel = iconVal + " " + labelVal;
        } else if (iconVal !== '') {
          finalLabel = iconVal;
        }

        urlsList.push({
          url: urlVal,
          icon: iconVal,
          label: finalLabel
        });
      }
    }

    var config = {
      gluroo_token: document.getElementById('gluroo_token').value.trim(),
      urls: urlsList
    };

    localStorage.setItem('pebble_settings', JSON.stringify(config));

    // Retorno al protocolo estándar de Pebble
    var returnTo = getQueryParam('return_to', 'pebblejs://close#');
    var locationUrl = returnTo + encodeURIComponent(JSON.stringify(config));
    window.location.href = locationUrl;
  });

  // Cancelar
  document.getElementById('btn-cancel').addEventListener('click', function() {
    var returnTo = getQueryParam('return_to', 'pebblejs://close#');
    window.location.href = returnTo;
  });

  // Inicializar al cargar
  loadSettings();
</script>

</body>
</html>
