<script>
  // Minificador automático para no sobrepasar el límite de Pebble (4094 bytes)
  function minifyCode(js) {
    if (!js) return '';
    return js
      .replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '') // Quitar comentarios
      .replace(/\s+/g, ' ')                               // Compactar espacios
      .trim();
  }

  // Plantilla optimizada del Betis
  var BETIS_CODE = `var url = "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/teams/244/schedule";
fetch(url)
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d) {
    var ev = d.events || [];
    if (!ev.length) { callback("BET: Sin datos"); return; }
    var now = new Date();
    var live = ev.find(function(e) { return e.competitions && e.competitions[0] && e.competitions[0].status.type.state === 'in'; });
    var f = ev.filter(function(e) {
      var c = e.competitions && e.competitions[0];
      return c && (c.status.type.state === 'post' || (new Date(e.date) <= now && c.competitors && c.competitors[0].score !== undefined));
    });
    f.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    var m = live || f[0] || ev[0];
    var c = m.competitions[0], h = c.competitors[0], a = c.competitors[1];
    function s(t) {
      if (!t) return '';
      if (typeof t.score === 'object' && t.score !== null) return t.score.displayValue || t.score.value || '';
      return t.score !== undefined ? String(t.score) : '';
    }
    var sh = s(h), sa = s(a), sc = (sh !== '' && sa !== '') ? (sh + '-' + sa) : 'vs';
    var hb = (h.team.abbreviation || 'BET').substring(0, 4);
    var ab = (a.team.abbreviation || 'RIV').substring(0, 4);
    if (c.status.type.state === 'in' && c.status.displayClock) callback(hb + ' ' + sc + ' ' + ab + ' (' + c.status.displayClock + ')');
    else callback(hb + ' ' + sc + ' ' + ab);
  })
  .catch(function(e) { callback("Error: " + e.message); });`;

  var JSON_CODE = `fetch("https://api.tu-servidor.com/datos")
  .then(function(r) { return r.json(); })
  .then(function(d) { callback(String(d.valor || d.value || d.result || "--")); })
  .catch(function() { callback("--"); });`;

  function loadBetisPreset(idx) {
    document.getElementById('icon_' + idx).value = '💚';
    document.getElementById('label_' + idx).value = 'BET';
    document.getElementById('code_' + idx).value = BETIS_CODE;
  }

  function loadJsonPreset(idx) {
    document.getElementById('icon_' + idx).value = '🌡';
    document.getElementById('label_' + idx).value = 'API';
    document.getElementById('code_' + idx).value = JSON_CODE;
  }

  // Probar script en navegador con timeout
  function testScript(idx) {
    var code = document.getElementById('code_' + idx).value.trim();
    var resDiv = document.getElementById('res_' + idx);
    resDiv.style.display = 'block';
    resDiv.style.color = '#3742fa';
    resDiv.innerText = 'Ejecutando...';

    if (!code) {
      resDiv.style.color = '#ff4757';
      resDiv.innerText = 'Código vacío';
      return;
    }

    var finished = false;
    var timeoutId = setTimeout(function() {
      if (!finished) {
        finished = true;
        resDiv.style.color = '#ff4757';
        resDiv.innerText = 'Error: Tiempo de espera agotado';
      }
    }, 6000);

    try {
      var runner = new Function('callback', code);
      runner(function(result) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        resDiv.style.color = '#2ed573';
        resDiv.innerText = 'Salida: "' + String(result) + '"';
      });
    } catch(err) {
      finished = true;
      clearTimeout(timeoutId);
      resDiv.style.color = '#ff4757';
      resDiv.innerText = 'Error sintaxis: ' + err.message;
    }
  }

  function getQueryParam(variable, defaultVal) {
    var query = window.location.search.substring(1);
    var vars = query.split('&');
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split('=');
      if (decodeURIComponent(pair[0]) === variable) {
        return decodeURIComponent(pair[1]);
      }
    }
    return defaultVal || null;
  }

  function loadSettings() {
    var raw = null;

    if (window.location.hash && window.location.hash.length > 1) {
      var hashContent = window.location.hash.substring(1);
      if (hashContent.startsWith('settings=')) {
        raw = decodeURIComponent(hashContent.substring(9));
      } else {
        raw = decodeURIComponent(hashContent);
      }
    }

    if (!raw) {
      raw = localStorage.getItem('pebble_js_settings');
    }

    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s.gluroo_token) document.getElementById('gluroo_token').value = s.gluroo_token;
        if (s.scripts && Array.isArray(s.scripts)) {
          s.scripts.forEach(function(item, index) {
            var i = index + 1;
            if (i <= 4) {
              document.getElementById('icon_' + i).value = item.icon || '';
              document.getElementById('label_' + i).value = item.label || '';
              document.getElementById('code_' + i).value = item.code || '';
            }
          });
        }
      } catch(e) {
        console.error("Error cargando configuración:", e);
      }
    } else {
      loadBetisPreset(1);
    }
  }

  // Guardar y retornar a Pebble con minificación automática
  document.getElementById('btn-save').addEventListener('click', function() {
    var scripts = [];
    for (var i = 1; i <= 4; i++) {
      var code = document.getElementById('code_' + i).value.trim();
      var icon = document.getElementById('icon_' + i).value.trim();
      var label = document.getElementById('label_' + i).value.trim();

      if (code !== '') {
        var finalLabel = label;
        if (icon !== '' && label !== '') finalLabel = icon + " " + label;
        else if (icon !== '') finalLabel = icon;

        scripts.push({
          code: minifyCode(code), // <- Minificación automática aquí
          icon: icon,
          label: finalLabel
        });
      }
    }

    var config = {
      gluroo_token: document.getElementById('gluroo_token').value.trim(),
      scripts: scripts
    };

    localStorage.setItem('pebble_js_settings', JSON.stringify(config));

    var returnTo = getQueryParam('return_to', 'pebblejs://close#');
    window.location.href = returnTo + encodeURIComponent(JSON.stringify(config));
  });

  document.getElementById('btn-cancel').addEventListener('click', function() {
    var returnTo = getQueryParam('return_to', 'pebblejs://close#');
    window.location.href = returnTo;
  });

  loadSettings();
</script>
