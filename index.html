    :root {

      --text: #ffffff;
      --text-dim: #a4b0be;
      --border: #333333;

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;

    }
    .header {

    }

      font-size: 22px;
      color: var(--accent);
    }
    .header p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--text-dim);
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }
    input[type="text"], select, textarea {
      width: 100%;
      background: #252525;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
    }
    textarea {
      font-family: "Courier New", monospace;
      font-size: 12px;
      resize: vertical;
      min-height: 60px;
    }
    .script-block {
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .script-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .script-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .script-title {
      font-weight: 700;
      color: var(--accent-amber);
    }
    .slot-row {
      display: flex;
      gap: 8px;
    }
    .slot-select {
      flex: 0 0 140px;
    }
    .slot-name {
      flex: 1;
    }
    .btn-test {

      border: 1px solid var(--border);
      color: var(--accent-blue);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .output-box {
      font-family: monospace;
      font-size: 11px;
      padding: 6px 10px;
      background: #181818;
      border-radius: 6px;
      margin-top: 4px;

      color: var(--text-dim);

    .btn-save {

      border-radius: 10px;
      font-size: 16px;

    }
    .footer {

  <script>
    function getQueryParam(variable, defaultVal) {
      var query = window.location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) return decodeURIComponent(pair[1]);
      }
      return defaultVal;
    }

    function fetchEspn(id, callback) {
      var url = "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/teams/" + id + "/schedule";
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.timeout = 10000;
      xhr.onload = function() {
        try {
          var res = JSON.parse(xhr.responseText);
          var events = res.events || [];
          if (events.length === 0) { callback("Sin partidos"); return; }
          var ev = events[events.length - 1];
          for (var i = 0; i < events.length; i++) {
            var st = events[i].competitions[0].status.type.state;
            if (st === "in") { ev = events[i]; break; }
            if (st === "post") { ev = events[i]; }
          }
          var comp = ev.competitions[0];
          var h = comp.competitors[0], a = comp.competitors[1];
          var sh = (h.score && h.score.displayValue) ? h.score.displayValue : (h.score || "0");
          var sa = (a.score && a.score.displayValue) ? a.score.displayValue : (a.score || "0");
          var hb = ((h.team && h.team.abbreviation) || "LOC").substring(0, 4);
          var ab = ((a.team && a.team.abbreviation) || "VIS").substring(0, 4);
          callback(hb + " " + sh + "-" + sa + " " + ab);
        } catch(e) { callback("Error ESPN"); }
      };
      xhr.onerror = function() { callback("Error red"); };
      xhr.ontimeout = function() { callback("Timeout"); };
      xhr.send();
    }

    function fetchJson(url, key, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.timeout = 10000;
      xhr.onload = function() {
        try {
          var d = JSON.parse(xhr.responseText);
          var val = d;
          if (key) {
            var parts = key.split('.');
            for (var p = 0; p < parts.length; p++) val = val[parts[p]];
          }
          callback(String(val !== undefined ? val : "--"));
        } catch(e) { callback("Error parse"); }
      };
      xhr.onerror = function() { callback("Error red"); };
      xhr.ontimeout = function() { callback("Timeout"); };
      xhr.send();
    }

    function testGluroo() {
      var token = document.getElementById('gluroo_token').value.trim();
      var out = document.getElementById('output_gluroo');
      if (!token) {
        out.innerText = "Introduce un token primero";
        out.style.color = "var(--accent-red)";
        return;
      }
      out.innerText = "Consultando...";
      out.style.color = "var(--accent-blue)";

      var url = (token.indexOf("http") === 0) ? token :
        "https://e8ba.ns.gluroo.com:39893/api/v1/entries.json?token=" + token + "&count=2";

      var xhr = new XMLHttpRequest();
      xhr.timeout = 10000;
      xhr.open('GET', url, true);
      xhr.onload = function() {
        try {
          var data = JSON.parse(xhr.responseText);
          if (data && data.length > 0) {
            var sgv = data[0].sgv;
            var delta = "";
            if (data.length >= 2 && data[1].sgv !== undefined) {
              var d = sgv - data[1].sgv;
              delta = " " + (d > 0 ? "+" : "") + d;
            }
            out.innerText = "OK: " + sgv + delta + " mg/dL";
            out.style.color = "var(--accent)";
          } else {
            out.innerText = "Sin lecturas recientes";
            out.style.color = "var(--accent-amber)";
          }
        } catch(e) {
          out.innerText = "Error parseando JSON";
          out.style.color = "var(--accent-red)";
        }
      };
      xhr.onerror = function() { out.innerText = "Error red"; out.style.color = "var(--accent-red)"; };
      xhr.ontimeout = function() { out.innerText = "Timeout"; out.style.color = "var(--accent-red)"; };
      xhr.send();
    }

    function testScript(idx) {
      var codeEl = document.getElementById('code_' + idx);
      var code = codeEl ? codeEl.value.trim() : '';
      var out = document.getElementById('output_' + idx);
      if (!code) {
        out.innerText = "Casilla vacía";
        out.style.color = "var(--accent-amber)";
        return;
      }
      out.innerText = "Ejecutando...";
      out.style.color = "var(--accent-blue)";

      var called = false;
      var timer = setTimeout(function() {
        if (!called) {
          called = true;
          out.innerText = "Timeout (>8s)";
          out.style.color = "var(--accent-red)";
        }
      }, 8000);

      try {
        var fn = new Function('fetchEspn', 'fetchJson', 'callback', code);
        fn(fetchEspn, fetchJson, function(res) {
          if (called) return;
          called = true;
          clearTimeout(timer);
          out.innerText = "OK: " + String(res);
          out.style.color = "var(--accent)";
        });
      } catch (err) {
        clearTimeout(timer);
        out.innerText = "Error: " + err.message;
        out.style.color = "var(--accent-red)";
      }
    }

    function loadConfig() {
      try {
        var param = getQueryParam('config', '');
        var hash = window.location.hash.substring(1);
        var config = null;

        if (param) {
          config = JSON.parse(decodeURIComponent(param));
        } else if (hash) {
          config = JSON.parse(decodeURIComponent(hash));
        } else {
          config = {
            gluroo_token: localStorage.getItem('gluroo_token') || '',
            scripts: JSON.parse(localStorage.getItem('custom_scripts') || '[]')
          };
        }

        if (config && config.gluroo_token) {
          var gt = document.getElementById('gluroo_token');
          if (gt) gt.value = config.gluroo_token;
        }

        var scripts = (config && config.scripts) ? config.scripts : [];
        for (var i = 0; i < 4; i++) {
          if (scripts[i]) {
            var rawLabel = scripts[i].label || '';
            var code = scripts[i].code || '';
            var cEl = document.getElementById('code_' + i);
            if (cEl) cEl.value = code;

            var parts = rawLabel.split(' ');
            if (parts.length > 1) {
              var sel = document.getElementById('icon_' + i);
              if (sel) {
                for (var o = 0; o < sel.options.length; o++) {
                  if (sel.options[o].value === parts[0]) {
                    sel.selectedIndex = o;
                    break;
                  }
                }
              }
              var nEl = document.getElementById('name_' + i);
              if (nEl) nEl.value = parts.slice(1).join(' ');
            } else {
              var nEl2 = document.getElementById('name_' + i);
              if (nEl2) nEl2.value = rawLabel;
            }
          }
        }
      } catch(e) {
        console.log("Error cargando config:", e);
      }
    }

    function saveAndClose() {
      try {
        var scripts = [];
        for (var i = 0; i < 4; i++) {
          var cEl = document.getElementById('code_' + i);
          var code = cEl ? cEl.value.trim() : '';

          var iEl = document.getElementById('icon_' + i);
          var icon = iEl ? iEl.value : '★';

          var nEl = document.getElementById('name_' + i);
          var name = nEl ? nEl.value.trim() : '';

          var label = (icon + ' ' + (name || ('U' + (i + 1)))).trim();

          // Guardamos cada slot en su posición exacta
          scripts.push({
            label: (code !== '') ? label : '',
            code: code
          });
        }

        var gtEl = document.getElementById('gluroo_token');
        var config = {
          gluroo_token: gtEl ? gtEl.value.trim() : '',
          scripts: scripts
        };

        // Guardar localmente
        localStorage.setItem('gluroo_token', config.gluroo_token);
        localStorage.setItem('custom_scripts', JSON.stringify(config.scripts));

        // Cerrar WebView y retornar a Pebble
        var return_to = getQueryParam('return_to', 'pebblejs://close#');
        var configStr = encodeURIComponent(JSON.stringify(config));
        window.location.href = return_to + configStr;
      } catch (err) {
        alert("Error al guardar: " + err.message);
      }
    }

    window.onload = loadConfig;
  </script>
</body>
</html>
