<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configuración Pebble JS Puller</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --text-main: #ffffff;
      --text-muted: #9e9e9e;
      --accent: #2ed573;
      --accent-hover: #26af5f;
      --btn-secondary: #333333;
      --input-bg: #272727;
      --input-border: #3d3d3d;
      --radius: 12px;
      --code-bg: #181818;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 550px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 10px 12px;
      background: var(--code-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #a4b0be;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .row-meta {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-preset {
      background: #2b2b2b;
      color: #ced6e0;
      border: 1px solid #404040;
      border-radius: 6px;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }

    .btn-test {
      background: #3742fa;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: 600;
      float: right;
    }

    .test-result {
      font-size: 12px;
      color: #2ed573;
      margin-top: 4px;
      font-family: monospace;
      display: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin: 24px 0 40px 0;
    }

    button.btn-primary {
      flex: 2;
      background: var(--accent);
      color: #121212;
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button.btn-secondary {
      flex: 1;
      background: var(--btn-secondary);
      color: var(--text-muted);
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .badge {
      background: rgba(46, 213, 115, 0.15);
      color: var(--accent);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Pebble JS Puller</h1>
    <p>Scripts JavaScript personalizados para tu reloj</p>
  </header>

  <!-- GLUROO TOKEN -->
  <div class="card">
    <div class="card-title">
      <span>🩸 Gluroo (Glucosa)</span>
    </div>
    <div class="form-group">
      <label>Token Gluroo</label>
      <input type="text" id="gluroo_token" placeholder="Token de Gluroo (opcional)">
    </div>
  </div>

  <!-- SECCIÓN JS SLOTS (1 al 4) -->
  <div class="card">
    <div class="card-title">
      <span>⚡ Scripts JS para Display Inferior</span>
      <span class="badge">Hasta 4 Scripts</span>
    </div>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
      Cada script debe llamar a <code>callback("resultado")</code> con el texto que aparecerá en el reloj (máx. 16 caracteres).
    </p>

    <!-- SCRIPT 1 -->
    <div style="border-bottom: 1px solid #2d2d2d; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="row-meta">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_1" placeholder="💚" maxlength="4">
        </div>
        <div>
          <label>Etiqueta</label>
          <input type="text" id="label_1" placeholder="BETIS" maxlength="6">
        </div>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="margin: 0;">Código JS (Script 1)</label>
          <div>
            <button type="button" class="btn-preset" onclick="loadBetisPreset(1)">Plantilla Betis</button>
            <button type="button" class="btn-test" onclick="testScript(1)">Probar JS</button>
          </div>
        </div>
        <textarea id="code_1" placeholder="fetch('https://...').then(...)"></textarea>
        <div id="res_1" class="test-result"></div>
      </div>
    </div>

    <!-- SCRIPT 2 -->
    <div style="border-bottom: 1px solid #2d2d2d; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="row-meta">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_2" placeholder="🌡" maxlength="4">
        </div>
        <div>
          <label>Etiqueta</label>
          <input type="text" id="label_2" placeholder="CASA" maxlength="6">
        </div>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="margin: 0;">Código JS (Script 2)</label>
          <div>
            <button type="button" class="btn-preset" onclick="loadJsonPreset(2)">Plantilla API</button>
            <button type="button" class="btn-test" onclick="testScript(2)">Probar JS</button>
          </div>
        </div>
        <textarea id="code_2" placeholder="fetch('https://...').then(...)"></textarea>
        <div id="res_2" class="test-result"></div>
      </div>
    </div>

    <!-- SCRIPT 3 -->
    <div style="border-bottom: 1px solid #2d2d2d; padding-bottom: 14px; margin-bottom: 14px;">
      <div class="row-meta">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_3" placeholder="⚡" maxlength="4">
        </div>
        <div>
          <label>Etiqueta</label>
          <input type="text" id="label_3" placeholder="LUZ" maxlength="6">
        </div>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="margin: 0;">Código JS (Script 3)</label>
          <div>
            <button type="button" class="btn-preset" onclick="loadJsonPreset(3)">Plantilla API</button>
            <button type="button" class="btn-test" onclick="testScript(3)">Probar JS</button>
          </div>
        </div>
        <textarea id="code_3" placeholder="fetch('https://...').then(...)"></textarea>
        <div id="res_3" class="test-result"></div>
      </div>
    </div>

    <!-- SCRIPT 4 -->
    <div>
      <div class="row-meta">
        <div>
          <label>Icono</label>
          <input type="text" id="icon_4" placeholder="📊" maxlength="4">
        </div>
        <div>
          <label>Etiqueta</label>
          <input type="text" id="label_4" placeholder="CO2" maxlength="6">
        </div>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="margin: 0;">Código JS (Script 4)</label>
          <div>
            <button type="button" class="btn-test" onclick="testScript(4)">Probar JS</button>
          </div>
        </div>
        <textarea id="code_4" placeholder="fetch('https://...').then(...)"></textarea>
        <div id="res_4" class="test-result"></div>
      </div>
    </div>
  </div>

  <!-- BOTONES -->
  <div class="actions">
    <button type="button" class="btn-secondary" id="btn-cancel">Cancelar</button>
    <button type="button" class="btn-primary" id="btn-save">Guardar en Pebble</button>
  </div>
</div>

<script>
  // Plantilla optimizada del Betis con bypass de CORS para prueba en navegador
  var BETIS_CODE = `var apiUrl = "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/teams/244/schedule";
if (typeof window !== "undefined" && window.location && window.location.hostname && window.location.hostname.indexOf("github.io") !== -1) {
  apiUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(apiUrl);
}
fetch(apiUrl)
  .then(function(res) { return res.text(); })
  .then(function(rawText) {
    if (rawText.trim().startsWith("<")) { callback("BET: Error resp"); return; }
    var data = JSON.parse(rawText);
    var events = data.events || [];
    if (events.length === 0) { callback("BET: Sin datos"); return; }
    var live = events.find(function(e) { return e.competitions[0].status.type.state === 'in'; });
    var last = events.filter(function(e) { return e.competitions[0].status.type.state === 'post'; }).pop();
    var match = live || last || events[0];
    var comp = match.competitions[0];
    var h = comp.competitors[0], a = comp.competitors[1];
    function getScore(t) {
      if (!t) return '';
      if (typeof t.score === 'object' && t.score !== null) return t.score.displayValue || t.score.value || '';
      return t.score !== undefined ? String(t.score) : '';
    }
    var sh = getScore(h), sa = getScore(a);
    var scoreStr = (sh !== '' && sa !== '') ? (sh + '-' + sa) : 'vs';
    var habbr = (h.team.abbreviation || 'BET').substring(0, 4);
    var aabbr = (a.team.abbreviation || 'RIV').substring(0, 4);
    callback(habbr + ' ' + scoreStr + ' ' + aabbr);
  })
  .catch(function(err) { callback("BET: Error red"); });`;

  var JSON_CODE = `fetch("https://api.tu-servidor.com/datos")
  .then(function(res) { return res.json(); })
  .then(function(d) {
    callback(String(d.valor || d.value || d.result || "--"));
  })
  .catch(function() {
    callback("--");
  });`;

  function loadBetisPreset(idx) {
    document.getElementById('icon_' + idx).value = '💚';
    document.getElementById('label_' + idx).value = 'BET';
    document.getElementById('code_' + idx).value = BETIS_CODE;
  }

  function loadJsonPreset(idx) {
    document.getElementById('icon_' + idx).value = '🌡';
    document.getElementById('label_' + idx).value = 'API';
    document.getElementById('code_' + idx).value = JSON_CODE;
  }

  // Probar script en navegador con timeout
  function testScript(idx) {
    var code = document.getElementById('code_' + idx).value.trim();
    var resDiv = document.getElementById('res_' + idx);
    resDiv.style.display = 'block';
    resDiv.style.color = '#3742fa';
    resDiv.innerText = 'Ejecutando...';

    if (!code) {
      resDiv.style.color = '#ff4757';
      resDiv.innerText = 'Código vacío';
      return;
    }

    var finished = false;
    var timeoutId = setTimeout(function() {
      if (!finished) {
        finished = true;
        resDiv.style.color = '#ff4757';
        resDiv.innerText = 'Error: Tiempo de espera agotado (Timeout)';
      }
    }, 6000);

    try {
      var runner = new Function('callback', code);
      runner(function(result) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        resDiv.style.color = '#2ed573';
        resDiv.innerText = 'Salida: "' + String(result) + '"';
      });
    } catch(err) {
      finished = true;
      clearTimeout(timeoutId);
      resDiv.style.color = '#ff4757';
      resDiv.innerText = 'Error sintaxis: ' + err.message;
    }
  }

  // Cargar configuración sin límite de tamaño (usando Hash #)
  function loadSettings() {
    var raw = null;

    if (window.location.hash && window.location.hash.length > 1) {
      var hashContent = window.location.hash.substring(1);
      if (hashContent.startsWith('settings=')) {
        raw = decodeURIComponent(hashContent.substring(9));
      } else {
        raw = decodeURIComponent(hashContent);
      }
    }

    if (!raw) {
      raw = localStorage.getItem('pebble_js_settings');
    }

    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s.gluroo_token) document.getElementById('gluroo_token').value = s.gluroo_token;
        if (s.scripts && Array.isArray(s.scripts)) {
          s.scripts.forEach(function(item, index) {
            var i = index + 1;
            if (i <= 4) {
              document.getElementById('icon_' + i).value = item.icon || '';
              document.getElementById('label_' + i).value = item.label || '';
              document.getElementById('code_' + i).value = item.code || '';
            }
          });
        }
      } catch(e) {
        console.error("Error parseando ajustes:", e);
      }
    } else {
      loadBetisPreset(1);
    }
  }

  // Guardar y retornar a Pebble
  document.getElementById('btn-save').addEventListener('click', function() {
    var scripts = [];
    for (var i = 1; i <= 4; i++) {
      var code = document.getElementById('code_' + i).value.trim();
      var icon = document.getElementById('icon_' + i).value.trim();
      var label = document.getElementById('label_' + i).value.trim();

      if (code !== '') {
        var finalLabel = label;
        if (icon !== '' && label !== '') finalLabel = icon + " " + label;
        else if (icon !== '') finalLabel = icon;

        scripts.push({
          code: code,
          icon: icon,
          label: finalLabel
        });
      }
    }

    var config = {
      gluroo_token: document.getElementById('gluroo_token').value.trim(),
      scripts: scripts
    };

    localStorage.setItem('pebble_js_settings', JSON.stringify(config));

    // Retorno estándar a Pebble
    window.location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(config));
  });

  // Cancelar
  document.getElementById('btn-cancel').addEventListener('click', function() {
    window.location.href = 'pebblejs://close#';
  });

  loadSettings();
</script>

</body>
</html>
