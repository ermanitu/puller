<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configuración Pebble Puller</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #00e676; /* Verde Betis */
      --border: #333333;
      --input-bg: #2a2a2a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.4;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .header p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    input[type="text"], textarea, select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: #ffffff;
      padding: 10px 12px;
      margin-bottom: 8px;
      outline: none;
    }
    select {
      cursor: pointer;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    textarea {
      width: 100%;
      font-family: Consolas, Menlo, Monaco, monospace;
      font-size: 13px;
      min-height: 60px;
      resize: vertical;
    }
    .btn-test {
      background: #252525;
      border: 1px solid #2979ff;
      color: #2979ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-test:active {
      background: #2979ff;
      color: #ffffff;
    }
    .btn-save {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #000000;
      margin-top: 8px;
    }
    .btn-save:active {
      background: #00c853;
    }
    .script-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .script-badge {
      background: #333;
      color: var(--accent);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid var(--accent);
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 20px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Pebble Puller</h1>
    <p>Configuración de Pantalla y Scripts</p>
  </div>

  <!-- CONFIGURACIÓN DE GLUROO -->

    <label for="gluroo_token">Token o URL de Gluroo (opcional):</label>
    <input type="text" id="gluroo_token" placeholder="gluroo-token-12345" style="width: 100%;">
  </div>

  <!-- SCRIPTS PERSONALIZADOS (1 a 4) -->

    <!-- Script 2 -->
    <div style="border-bottom: 1px solid #2a2a2a; padding-bottom: 12px; margin-bottom: 12px;">
      <div class="script-header">
        <label>Script 2</label>
        <span class="script-badge">U2</span>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="icon_1" style="width: 135px;">
          <option value="⚽">⚽ Balón</option>
          <option value="♥">♥ Corazón</option>
          <option value="★">★ Estrella</option>
          <option value="⚡">⚡ Rayo</option>
          <option value="▲">▲ Subida</option>
          <option value="▼">▼ Bajada</option>
          <option value="℃">℃ Grados</option>
          <option value="●">● Círculo</option>
          <option value="☁">☁ Nube</option>
          <option value="☂">☂ Lluvia</option>
          <option value="✔">✔ Check</option>
          <option value="">Sin icono</option>
        </select>
        <input type="text" id="label_1" placeholder="Nombre (ej: RMA)" style="flex: 1; margin-bottom: 0;">
      </div>
      <textarea id="code_1" placeholder='fetchEspn("86", callback);'></textarea>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button type="button" class="btn-test" onclick="testScript(1)">▶ Probar</button>
        <span id="out_1" style="font-size: 12px; font-family: monospace; color: #a0a0a0;"></span>
      </div>
    </div>

    <!-- Script 3 -->
    <div style="border-bottom: 1px solid #2a2a2a; padding-bottom: 12px; margin-bottom: 12px;">
      <div class="script-header">
        <label>Script 3</label>
        <span class="script-badge">U3</span>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="icon_2" style="width: 135px;">
          <option value="▲">▲ Subida</option>
          <option value="▼">▼ Bajada</option>
          <option value="★">★ Estrella</option>
          <option value="⚡">⚡ Rayo</option>
          <option value="♥">♥ Corazón</option>
          <option value="⚽">⚽ Balón</option>
          <option value="℃">℃ Grados</option>
          <option value="●">● Círculo</option>
          <option value="☁">☁ Nube</option>
          <option value="☂">☂ Lluvia</option>
          <option value="✔">✔ Check</option>
          <option value="">Sin icono</option>
        </select>
        <input type="text" id="label_2" placeholder="Nombre (ej: AAPL)" style="flex: 1; margin-bottom: 0;">
      </div>
      <textarea id="code_2" placeholder="// Código"></textarea>
      <div style="display: flex; align-items: center; gap: 8px;">

    <!-- Script 4 -->
    <div>
      <div class="script-header">
        <label>Script 4</label>
        <span class="script-badge">U4</span>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="icon_3" style="width: 135px;">
          <option value="★">★ Estrella</option>
          <option value="⚡">⚡ Rayo</option>
          <option value="♥">♥ Corazón</option>
          <option value="⚽">⚽ Balón</option>
          <option value="▲">▲ Subida</option>
          <option value="▼">▼ Bajada</option>
          <option value="℃">℃ Grados</option>
          <option value="●">● Círculo</option>
          <option value="☁">☁ Nube</option>
          <option value="☂">☂ Lluvia</option>
          <option value="✔">✔ Check</option>

  <!-- BOTÓN GUARDAR -->
  <button type="button" class="btn-save" onclick="saveAndClose()">GUARDAR EN EL RELOJ</button>

  <div class="footer">
    Pebble Puller • Modo Táctico
  </div>

  <script>
    function getQueryParam(variable, defaultVal) {
      var query = window.location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultVal;
    }

    function setScriptField(idx, fullLabel, code) {
      document.getElementById('code_' + idx).value = code || '';
      var iconSelect = document.getElementById('icon_' + idx);
      var textInput = document.getElementById('label_' + idx);
      
      var icons = ['♥', '⚽', '★', '⚡', '▲', '▼', '℃', '●', '☁', '☂', '✔'];
      var foundIcon = '';
      var cleanName = fullLabel || '';
      
      for (var j = 0; j < icons.length; j++) {
        if (cleanName.indexOf(icons[j]) === 0) {
          foundIcon = icons[j];
          cleanName = cleanName.substring(icons[j].length).trim();
          break;
        }
      }
      
      if (foundIcon) {
        iconSelect.value = foundIcon;
      }
      textInput.value = cleanName;
    }

    function loadConfig() {
      try {
        var hash = window.location.hash.substring(1);
        var config = {};
        if (hash) {
          config = JSON.parse(decodeURIComponent(hash));
        } else {
          config = {
            gluroo_token: localStorage.getItem('gluroo_token') || '',
            scripts: JSON.parse(localStorage.getItem('custom_scripts') || '[]')
          };
        }

        if (config.gluroo_token) {
          document.getElementById('gluroo_token').value = config.gluroo_token;
        }

        var scripts = config.scripts || [];
        for (var i = 0; i < 4; i++) {
          if (scripts[i]) {
            setScriptField(i, scripts[i].label || '', scripts[i].code || '');
          }
        }
      } catch(e) {
        console.log("Error cargando config:", e);
      }
    }

    // Probar el script en el navegador (función de anoche protegida con proxy)
    function testScript(idx) {
      var code = document.getElementById('code_' + idx).value;
      var out = document.getElementById('out_' + idx);
      if (!code || code.trim() === '') {
        out.innerText = "Escribe código primero";
        out.style.color = "#ffb703";
        return;
      }
      out.innerText = "Probando...";
      out.style.color = "#2979ff";

      function callback(res) {
        out.innerText = "OK: " + String(res);
        out.style.color = "#00e676";
      }

      function fetchEspn(id, cb) {
        var url = "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/teams/" + id + "/schedule";
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 8000;
        xhr.onload = function() {
          try {
            var data = JSON.parse(xhr.responseText);
            var events = data.events || [];
            if (events.length === 0) { cb("Sin partidos"); return; }
            var ev = events[events.length - 1];
            for (var i = 0; i < events.length; i++) {
              var st = events[i].competitions[0].status.type.state;
              if (st === "in") { ev = events[i]; break; }
              if (st === "post") { ev = events[i]; }
            }
            var comp = ev.competitions[0];
            var h = comp.competitors[0], a = comp.competitors[1];
            var sh = (h.score && h.score.displayValue) ? h.score.displayValue : (h.score || "0");
            var sa = (a.score && a.score.displayValue) ? a.score.displayValue : (a.score || "0");
            var hb = (h.team.abbreviation || "LOC").substring(0, 4);
            var ab = (a.team.abbreviation || "VIS").substring(0, 4);
            cb(hb + " " + sh + "-" + sa + " " + ab);
          } catch(e) { cb("Error datos"); }
        };
        xhr.onerror = function() {
          // Fallback por si Safari bloquea CORS en github.io
          var pUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
          var pXhr = new XMLHttpRequest();
          pXhr.open("GET", pUrl, true);
          pXhr.timeout = 8000;
          pXhr.onload = function() {
            try {
              var data = JSON.parse(pXhr.responseText);
              var events = data.events || [];
              var ev = events[events.length - 1];
              var comp = ev.competitions[0];
              var h = comp.competitors[0], a = comp.competitors[1];
              var sh = (h.score && h.score.displayValue) ? h.score.displayValue : (h.score || "0");
              var sa = (a.score && a.score.displayValue) ? a.score.displayValue : (a.score || "0");
              var hb = (h.team.abbreviation || "LOC").substring(0, 4);
              var ab = (a.team.abbreviation || "VIS").substring(0, 4);
              cb(hb + " " + sh + "-" + sa + " " + ab);
            } catch(err2) { cb("Error datos"); }
          };
          pXhr.onerror = function() { cb("Error red"); };
          pXhr.send();
        };
        xhr.send();
      }

      function fetchJson(url, key, cb) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 8000;
        xhr.onload = function() {
          try {
            var d = JSON.parse(xhr.responseText);
            var val = key ? d[key] : d;
            cb(String(val));
          } catch(e) { cb("Error JSON"); }
        };
        xhr.onerror = function() {
          var pXhr = new XMLHttpRequest();
          pXhr.open("GET", "https://corsproxy.io/?" + encodeURIComponent(url), true);
          pXhr.timeout = 8000;
          pXhr.onload = function() {
            try {
              var d = JSON.parse(pXhr.responseText);
              var val = key ? d[key] : d;
              cb(String(val));
            } catch(e) { cb("Error JSON"); }
          };
          pXhr.onerror = function() { cb("Error red"); };
          pXhr.send();
        };
        xhr.send();
      }

      try {
        var fn = new Function('callback', 'fetchEspn', 'fetchJson', code);
        fn(callback, fetchEspn, fetchJson);
      } catch(err) {
        try {
          var fn2 = new Function('fetchEspn', 'fetchJson', 'callback', code);
          fn2(fetchEspn, fetchJson, callback);
        } catch(err2) {
          out.innerText = "Error: " + err.message;
          out.style.color = "#ff5252";
        }
      }
    }

    function saveAndClose() {
      var scripts = [];
      for (var i = 0; i < 4; i++) {
        var icon = document.getElementById('icon_' + i).value;
        var labelText = document.getElementById('label_' + i).value.trim();
        var code = document.getElementById('code_' + i).value.trim();
        
        var combinedLabel = icon ? (icon + " " + labelText).trim() : labelText;
        if (combinedLabel !== '' || code !== '') {
          scripts.push({
            label: combinedLabel || ('U' + (i + 1)),
            code: code
          });
        }
      }

      var config = {
        gluroo_token: document.getElementById('gluroo_token').value.trim(),
        scripts: scripts
      };

      localStorage.setItem('gluroo_token', config.gluroo_token);
      localStorage.setItem('custom_scripts', JSON.stringify(config.scripts));

      // Protocolo original de retorno en iOS / Android
      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      var configStr = encodeURIComponent(JSON.stringify(config));
      
      var targetUrl = return_to + configStr;
      document.location = targetUrl;
    }

    window.onload = loadConfig;
  </script>
</body>
</html>
